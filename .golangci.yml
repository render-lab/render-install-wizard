version: "2"
run:
  tests: true
linters:
  enable:
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        # Keep the exported-symbol doc-comment enforcement, but drop the
        # package-name stutter check: names like detect.DetectTools /
        # detect.DetectPlatform read clearly and cannot collapse to the noun
        # (detect.Platform already names a type).
        - name: exported
          arguments:
            - disableStutteringCheck
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/render-lab/render-install-wizard
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
