# GoReleaser config for the render-setup wizard.
# Docs: https://goreleaser.com
version: 2

project_name: render-setup

before:
  hooks:
    - go mod tidy

builds:
  - id: render-setup
    main: ./cmd/render-setup
    binary: render-setup
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # main.version is reported by `render-setup --version`.
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

# Publish raw binaries (not tarballs) so the bootstrap can download and chmod +x
# directly. Names are version-less to match paths.ArtifactName and keep the
# GitHub "latest" download URL stable.
archives:
  - id: binaries
    formats:
      - binary
    name_template: "render-setup_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Sign the checksums manifest with cosign in keyless mode, using the ambient OIDC
# token from GitHub Actions (so there is no private key to store or rotate).
#
# Only the manifest is signed, which covers every artifact: the manifest lists
# their SHA-256 digests, so a valid signature over it plus a digest match is proof
# for each binary, at one signature instead of five.
#
# This is for auditors, not for the bootstrap. Verifying a Sigstore signature needs
# cosign on the machine, which a dependency-light `curl | sh` cannot assume, so
# agents.sh still verifies digests only (see docs/SECURITY-MODEL.md). What signing
# adds is the ability for anyone to confirm after the fact that a release really
# came from this repo's workflow:
#
#   cosign verify-blob checksums.txt \
#     --signature checksums.txt.sig --certificate checksums.txt.pem \
#     --certificate-identity-regexp '^https://github.com/render-lab/render-install-wizard/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# This pipe also runs for snapshots, and it hard-fails when cosign is absent. Pass
# --skip=sign for any build that is not a real release (as .github/workflows/e2e.yml
# does, and as a local `goreleaser release --snapshot` needs to) -- keyless signing
# wants an OIDC identity those builds do not have, and no consumer of a snapshot
# looks at the signature.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

release:
  github:
    owner: render-lab
    name: render-install-wizard
  # Cut releases as drafts so a human can review assets before publishing.
  #
  # Both settings below decide whether the bootstrap can reach a release at all.
  # agents.sh downloads from `releases/latest/download/...`, and GitHub's "latest"
  # alias resolves only to a published, non-prerelease release. So:
  #
  #   - draft: true means a freshly tagged release is invisible to the bootstrap
  #     until a human publishes it. That gate is the point, but it does mean
  #     tagging alone does not ship anything -- see the publish step in
  #     docs/RELEASE.md.
  #   - prerelease: auto marks any tag carrying a prerelease suffix (v1.2.0-rc.1)
  #     as a GitHub prerelease, which "latest" also skips. That is intended: an rc
  #     must not become what a bare `curl | sh` installs. It also means an rc is
  #     only testable by pinning RENDER_SETUP_VERSION to its exact tag, and that a
  #     repo whose only releases are prereleases has no working bootstrap.
  draft: true
  prerelease: auto

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"
