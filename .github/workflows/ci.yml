name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "gofmt needed on:"; echo "$files"; exit 1; fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (includes manifest schema validation)
        run: go test ./...

  golangci:
    runs-on: ubuntu-latest
    # Advisory in Phase 0: the gating quality checks (build, vet, gofmt, test,
    # tidy) live in build-test. Flip continue-on-error off once the golangci-lint
    # version + config schema are validated against this repo.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (only if scripts exist)
        run: |
          if ls scripts/*.sh >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
            shellcheck scripts/*.sh
          else
            echo "no shell scripts yet; skipping"
          fi
