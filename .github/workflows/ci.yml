name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "gofmt needed on:"; echo "$files"; exit 1; fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (includes manifest schema validation)
        run: go test ./...

  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # golangci-lint v2.9.0 is the first release with Go 1.26 support, and the
      # action is pinned to a v2-capable major. This is a required gate (no
      # continue-on-error): if a future Go bump outpaces the pinned linter, this
      # job fails loudly instead of silently disabling the quality gate.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9.0

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          # Every tracked shell script, not just scripts/*.sh. The previous glob left
          # the majority of the repo's shell unchecked: test/e2e/*.sh is what proves
          # the bootstrap works, and deploy/render-com/agents.sh is the copy
          # render.com actually serves, so a quoting bug in either matters as much as
          # one in scripts/.
          # Fail rather than skip when nothing matches. The old version printed
          # "skipping" and exited green, so a path change could have quietly turned
          # this gate into a no-op that still reported success.
          if [ "$(git ls-files '*.sh' | wc -l)" -eq 0 ]; then
            echo "::error::no shell scripts found -- the shellcheck gate is covering nothing"
            exit 1
          fi
          git ls-files '*.sh'
          sudo apt-get update && sudo apt-get install -y shellcheck
          # -z/-0 pairs the listing with xargs safely, and avoids needing bash 4's
          # mapfile so the same command can be run by hand on any shell.
          git ls-files -z '*.sh' | xargs -0 shellcheck
